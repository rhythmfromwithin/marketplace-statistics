services:
  - type: web
    name: product-price-tracking
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm_config_ignore_scripts=false pnpm install --frozen-lockfile --ignore-scripts=false && pnpm rebuild better-sqlite3 --unsafe-perm && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:/tmp/dev.db
      - key: VITE_APP_ID
        value: product-price-tracking
      - key: USE_MOCK_API
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_OPEN_ID
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: RAINFOREST_API_KEY
        sync: false
      - key: RAINFOREST_MARKETPLACE
        value: US
