<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爆款商品雷达 — 多平台趋势发现工具</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f3ff; color: #1e1b4b; min-height: 100vh; }
.app-header { background: #fff; border-bottom: 1px solid #ede9fe; padding: 0 24px; display: flex; align-items: center; gap: 16px; height: 60px; box-shadow: 0 1px 4px rgba(124,58,237,0.07); }
.app-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: #7C3AED; }
.app-logo .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg,#7C3AED,#a78bfa); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.app-subtitle { font-size: 12px; color: #8b5cf6; font-weight: 400; margin-left: 4px; }
.layout { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.tab-bar { display: flex; gap: 4px; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 2px 8px rgba(124,58,237,0.08); margin-bottom: 24px; }
.tab-btn { flex: 1; padding: 10px 8px; border: none; background: transparent; border-radius: 10px; font-size: 14px; font-weight: 500; color: #6d28d9; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.tab-btn.active { background: #7C3AED; color: #fff; box-shadow: 0 2px 8px rgba(124,58,237,0.3); }
.tab-btn:hover:not(.active) { background: #ede9fe; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Filter bar */
.filter-bar { background: #fff; border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; box-shadow: 0 2px 8px rgba(124,58,237,0.06); }
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-label { font-size: 13px; color: #6d28d9; font-weight: 600; white-space: nowrap; }
.filter-select { border: 1.5px solid #ddd6fe; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: #1e1b4b; background: #faf5ff; cursor: pointer; outline: none; }
.filter-select:focus { border-color: #7C3AED; }
.checkbox-group { display: flex; gap: 10px; }
.checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
.checkbox-label input { accent-color: #7C3AED; width: 15px; height: 15px; }
.toggle-group { display: flex; background: #ede9fe; border-radius: 8px; padding: 3px; }
.toggle-btn { padding: 5px 14px; border: none; background: transparent; border-radius: 6px; font-size: 13px; font-weight: 500; color: #6d28d9; cursor: pointer; transition: all 0.15s; }
.toggle-btn.active { background: #7C3AED; color: #fff; }

/* Signal banner */
.signal-banner { background: #faf5ff; border: 1.5px solid #ddd6fe; border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.signal-banner-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; cursor: pointer; user-select: none; }
.signal-banner-title { font-size: 13px; font-weight: 600; color: #7C3AED; display: flex; align-items: center; gap: 8px; }
.signal-banner-arrow { font-size: 12px; color: #8b5cf6; transition: transform 0.2s; }
.signal-banner-arrow.open { transform: rotate(180deg); }
.signal-banner-body { padding: 0 18px 14px; display: none; }
.signal-banner-body.open { display: flex; gap: 20px; flex-wrap: wrap; }
.signal-item { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 180px; }
.signal-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
.signal-text { font-size: 12px; color: #4c1d95; line-height: 1.5; }
.signal-text strong { display: block; font-size: 13px; color: #6d28d9; }

/* Product grid */
.product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 700px) { .product-grid { grid-template-columns: 1fr; } }
.product-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(124,58,237,0.08); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
.product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(124,58,237,0.14); }
.product-img { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 48px; flex-shrink: 0; }
.product-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.product-title { font-size: 15px; font-weight: 700; color: #1e1b4b; line-height: 1.3; }
.product-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.category-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; background: #ede9fe; color: #6d28d9; }
.platform-badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
.platform-amazon { background: #fff3e0; color: #e65100; }
.platform-ebay { background: #e3f2fd; color: #1565c0; }
.platform-etsy { background: #e8f5e9; color: #2e7d32; }
.trend-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.trend-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; display: flex; align-items: center; gap: 3px; }
.tag-red { background: #fee2e2; color: #b91c1c; }
.tag-yellow { background: #fef9c3; color: #92400e; }
.tag-orange { background: #ffedd5; color: #c2410c; }
.price-range { font-size: 13px; color: #4c1d95; font-weight: 500; }
.price-range span { color: #7C3AED; font-weight: 700; }
.card-btn { margin-top: auto; padding: 9px; background: #7C3AED; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.card-btn:hover { background: #6d28d9; }

/* Tab 2 */
.section-card { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(124,58,237,0.08); padding: 22px 24px; margin-bottom: 20px; }
.section-title { font-size: 16px; font-weight: 700; color: #1e1b4b; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title .icon { font-size: 18px; }
.product-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.product-selector label { font-size: 14px; font-weight: 600; color: #6d28d9; }
.product-selector select { border: 1.5px solid #ddd6fe; border-radius: 10px; padding: 8px 14px; font-size: 14px; color: #1e1b4b; background: #faf5ff; outline: none; cursor: pointer; min-width: 220px; }
.product-selector select:focus { border-color: #7C3AED; }

/* Comparison table */
.compare-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.compare-table th { background: #7C3AED; color: #fff; padding: 10px 14px; text-align: center; font-weight: 600; }
.compare-table th:first-child { text-align: left; border-radius: 10px 0 0 0; }
.compare-table th:last-child { border-radius: 0 10px 0 0; }
.compare-table td { padding: 10px 14px; text-align: center; border-bottom: 1px solid #f3f0ff; }
.compare-table td:first-child { text-align: left; font-weight: 600; color: #4c1d95; }
.compare-table tr:last-child td { border-bottom: none; }
.compare-table tr:hover td { background: #faf5ff; }
.cell-low { background: #dcfce7 !important; color: #166534; font-weight: 700; border-radius: 6px; }
.cell-high { background: #fee2e2 !important; color: #991b1b; font-weight: 700; border-radius: 6px; }

/* Arbitrage box */
.arbitrage-box { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 2px solid #86efac; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.arbitrage-arrow { font-size: 28px; }
.arbitrage-text { flex: 1; }
.arbitrage-title { font-size: 13px; font-weight: 600; color: #166534; margin-bottom: 4px; }
.arbitrage-value { font-size: 22px; font-weight: 800; color: #15803d; }
.arbitrage-sub { font-size: 12px; color: #166534; margin-top: 2px; }

/* SVG chart */
.chart-wrap { width: 100%; overflow-x: auto; }
.chart-legend { display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

/* 7d summary table */
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 16px; }
.summary-table th { background: #ede9fe; color: #4c1d95; padding: 8px 12px; text-align: left; font-weight: 600; }
.summary-table td { padding: 8px 12px; border-bottom: 1px solid #f3f0ff; }
.summary-table tr:last-child td { border-bottom: none; }
.change-up { color: #dc2626; font-weight: 700; }
.change-down { color: #16a34a; font-weight: 700; }

/* Tab 3 AI */
.ai-generate-bar { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.ai-generate-btn { padding: 10px 24px; background: linear-gradient(135deg, #7C3AED, #a78bfa); color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
.ai-generate-btn:hover { opacity: 0.88; }
.spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-summary-card { background: linear-gradient(135deg, #faf5ff, #f3e8ff); border: 1.5px solid #ddd6fe; border-radius: 16px; padding: 22px 24px; display: none; }
.ai-summary-card.visible { display: block; }
.ai-summary-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.ai-summary-title { font-size: 17px; font-weight: 800; color: #4c1d95; }
.ai-body p { font-size: 14px; color: #1e1b4b; line-height: 1.75; margin-bottom: 12px; }
.data-basis { background: #fff; border: 1px solid #ddd6fe; border-radius: 10px; padding: 12px 16px; margin-top: 14px; }
.data-basis-title { font-size: 12px; font-weight: 700; color: #7C3AED; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.data-fields { display: flex; flex-wrap: wrap; gap: 8px; }
.data-field { font-size: 12px; background: #ede9fe; color: #4c1d95; padding: 3px 10px; border-radius: 20px; font-family: monospace; }
.ai-disclaimer { margin-top: 14px; font-size: 12px; color: #92400e; background: #fef9c3; border-radius: 8px; padding: 8px 12px; }
.other-products { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 20px; }
@media (max-width: 700px) { .other-products { grid-template-columns: 1fr; } }
.mini-card { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(124,58,237,0.07); display: flex; flex-direction: column; gap: 8px; }
.mini-card-title { font-size: 14px; font-weight: 700; color: #1e1b4b; }
.mini-card-btn { padding: 7px; background: #ede9fe; color: #6d28d9; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.mini-card-btn:hover { background: #ddd6fe; }

/* Tab 4 Watchlist */
.watchlist-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.watchlist-title { font-size: 18px; font-weight: 800; color: #1e1b4b; }
.add-btn { padding: 9px 18px; background: #7C3AED; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.add-btn:hover { background: #6d28d9; }
.watchlist-items { display: flex; flex-direction: column; gap: 12px; }
.watch-item { background: #fff; border-radius: 14px; padding: 16px 20px; box-shadow: 0 2px 10px rgba(124,58,237,0.07); display: flex; align-items: center; gap: 16px; transition: opacity 0.4s, transform 0.4s; }
.watch-item.removing { opacity: 0; transform: translateX(40px); }
.watch-img { width: 52px; height: 52px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.watch-info { flex: 1; }
.watch-title { font-size: 15px; font-weight: 700; color: #1e1b4b; margin-bottom: 5px; }
.watch-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.watch-time { font-size: 12px; color: #8b5cf6; }
.status-badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
.status-up { background: #fee2e2; color: #b91c1c; }
.status-stable { background: #fef9c3; color: #92400e; }
.status-cool { background: #dcfce7; color: #166534; }
.watch-actions { display: flex; gap: 8px; flex-shrink: 0; }
.watch-btn { padding: 7px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.watch-btn-detail { background: #ede9fe; color: #6d28d9; }
.watch-btn-detail:hover { background: #ddd6fe; }
.watch-btn-remove { background: #fee2e2; color: #b91c1c; }
.watch-btn-remove:hover { background: #fecaca; }
.empty-state { text-align: center; padding: 60px 20px; color: #8b5cf6; font-size: 15px; display: none; }
.empty-state .empty-icon { font-size: 52px; margin-bottom: 14px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="app-logo">
    <div class="logo-icon">📡</div>
    爆款商品雷达
    <span class="app-subtitle">多平台趋势发现工具</span>
  </div>
</header>
<div class="layout">
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab(0)">📈 趋势商品发现</button>
    <button class="tab-btn" onclick="switchTab(1)">💰 价格对比详情</button>
    <button class="tab-btn" onclick="switchTab(2)">✨ AI 趋势摘要</button>
    <button class="tab-btn" onclick="switchTab(3)">⭐ 我的关注</button>
  </div>

  <!-- TAB 1 -->
  <div class="tab-panel active" id="tab0">
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">类目</span>
        <select class="filter-select">
          <option>全部</option><option>电子产品</option><option>家居</option>
          <option>运动户外</option><option>美妆</option><option>宠物用品</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">平台</span>
        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" checked> Amazon</label>
          <label class="checkbox-label"><input type="checkbox" checked> eBay</label>
          <label class="checkbox-label"><input type="checkbox" checked> Etsy</label>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">时间范围</span>
        <div class="toggle-group">
          <button class="toggle-btn active" onclick="setToggle(this)">7天</button>
          <button class="toggle-btn" onclick="setToggle(this)">30天</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">排序</span>
        <select class="filter-select">
          <option>价格波动最大</option><option>价差最大</option><option>竞争者增长最快</option>
        </select>
      </div>
    </div>

    <div class="signal-banner">
      <div class="signal-banner-header" onclick="toggleBanner(this)">
        <div class="signal-banner-title">💡 趋势信号说明 — 我们如何判断一个商品正在爆发？</div>
        <div class="signal-banner-arrow">▼</div>
      </div>
      <div class="signal-banner-body">
        <div class="signal-item">
          <div class="signal-dot" style="background:#ef4444"></div>
          <div class="signal-text"><strong>价格波动</strong>短期内价格显著上涨，通常意味着需求超过供给，卖家开始提价。</div>
        </div>
        <div class="signal-item">
          <div class="signal-dot" style="background:#f59e0b"></div>
          <div class="signal-text"><strong>跨平台价差</strong>同一商品在不同平台售价差异较大，存在套利或差异化定价机会。</div>
        </div>
        <div class="signal-item">
          <div class="signal-dot" style="background:#ef4444"></div>
          <div class="signal-text"><strong>竞争者增加</strong>新卖家快速涌入，说明市场热度上升，但也意味着竞争加剧。</div>
        </div>
        <div class="signal-item">
          <div class="signal-dot" style="background:#f97316"></div>
          <div class="signal-text"><strong>库存紧张</strong>多个卖家库存低位，补货周期拉长，短期内供应偏紧。</div>
        </div>
      </div>
    </div>

    <div class="product-grid" id="productGrid">
    </div>
  </div>

  <!-- TAB 2 -->
  <div class="tab-panel" id="tab1">
    <div class="product-selector">
      <label>选择商品：</label>
      <select id="compareSelect" onchange="renderCompare()">
        <option value="0">无线降噪耳机 Pro</option>
        <option value="1">硅藻土浴室地垫</option>
        <option value="2">折叠瑜伽垫</option>
        <option value="3">宠物自动喂食器</option>
        <option value="4">LED美妆镜</option>
        <option value="5">便携式颈部按摩仪</option>
        <option value="6">竹制厨房收纳架</option>
        <option value="7">儿童编程机器人套件</option>
      </select>
    </div>

    <div class="section-card">
      <div class="section-title"><span class="icon">📊</span>平台价格对比</div>
      <div id="compareTableWrap"></div>
    </div>

    <div class="arbitrage-box" id="arbitrageBox">
      <div class="arbitrage-arrow">💹</div>
      <div class="arbitrage-text">
        <div class="arbitrage-title">套利机会发现</div>
        <div class="arbitrage-value" id="arbitrageValue"></div>
        <div class="arbitrage-sub" id="arbitrageSub"></div>
      </div>
    </div>

    <div class="section-card">
      <div class="section-title"><span class="icon">📉</span>7日价格走势</div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Amazon</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>eBay</div>
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Etsy</div>
      </div>
      <div class="chart-wrap">
        <svg id="priceChart" viewBox="0 0 600 280" width="100%" style="min-width:320px;display:block;"></svg>
      </div>
      <table class="summary-table" id="summaryTable"></table>
    </div>
  </div>

  <!-- TAB 3 -->
  <div class="tab-panel" id="tab2">
    <div class="section-card">
      <div class="product-selector">
        <label>选择商品：</label>
        <select id="aiSelect" onchange="resetAI()">
          <option value="0">无线降噪耳机 Pro</option>
          <option value="1">硅藻土浴室地垫</option>
          <option value="2">折叠瑜伽垫</option>
          <option value="3">宠物自动喂食器</option>
          <option value="4">LED美妆镜</option>
          <option value="5">便携式颈部按摩仪</option>
          <option value="6">竹制厨房收纳架</option>
          <option value="7">儿童编程机器人套件</option>
        </select>
      </div>
      <div class="ai-generate-bar">
        <button class="ai-generate-btn" id="generateBtn" onclick="generateSummary()">
          <div class="spinner" id="spinner"></div>
          <span id="generateBtnText">✨ 生成摘要</span>
        </button>
        <span style="font-size:13px;color:#8b5cf6;">基于价格、库存、竞争者等信号自动生成</span>
      </div>
      <div class="ai-summary-card" id="aiSummaryCard"></div>
    </div>
    <div class="section-title" style="margin-top:4px;"><span class="icon">📦</span>其他商品</div>
    <div class="other-products" id="otherProducts"></div>
  </div>

  <!-- TAB 4 -->
  <div class="tab-panel" id="tab3">
    <div class="watchlist-header">
      <div class="watchlist-title">⭐ 我的关注</div>
      <button class="add-btn" onclick="alert('功能开发中，请从趋势发现页添加商品')">＋ 添加商品</button>
    </div>
    <div class="watchlist-items" id="watchlistItems"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔍</div>
      <div>暂无关注商品，去趋势发现页添加吧</div>
    </div>
  </div>
</div>
<script>
const PRODUCTS = [
  { id:0, title:'无线降噪耳机 Pro', cat:'电子产品', emoji:'🎧', bg:'#ede9fe',
    platforms:['amazon','ebay','etsy'],
    tags:[{text:'价格上涨 +28%',cls:'tag-red'},{text:'竞争者激增 +92%',cls:'tag-red'}],
    priceRange:'$45 – $89',
    compare:{ amazon:{price:89,ship:0,land:89,sellers:312,stock:'充足'},
               ebay:{price:71,ship:5,land:76,sellers:198,stock:'充足'},
               etsy:{price:52,ship:8,land:60,sellers:44,stock:'偏低'} },
    arbitrage:'eBay → Amazon 套利空间 $18.50 (32%)',

function switchTab(idx) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-panel').forEach((p,i) => p.classList.toggle('active', i===idx));
  if(idx===1) renderCompare();
  if(idx===3) renderWatchlist();
}

function setToggle(btn) {
  btn.closest('.toggle-group').querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleBanner(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.signal-banner-arrow');
  body.classList.toggle('open');
  arrow.classList.toggle('open');
}

// TAB 2
function renderCompare() {
  const idx = parseInt(document.getElementById('compareSelect').value);
  const p = PRODUCTS[idx];
  const c = p.compare;
  const platforms = ['amazon','ebay','etsy'];
  const labels = ['Amazon','eBay','Etsy'];
  const rows = [
    {key:'price',label:'商品价格',fmt:v=>v!=null?`$${v}`:'—'},
    {key:'ship',label:'运费',fmt:v=>v!=null?(v===0?'免运费':`$${v}`):'—'},
    {key:'land',label:'落地价',fmt:v=>v!=null?`$${v}`:'—'},
    {key:'sellers',label:'卖家数量',fmt:v=>v!=null?`${v}家`:'—'},
    {key:'stock',label:'库存状态',fmt:v=>v||'—'}
  ];
  const landVals = platforms.map(pl => c[pl].land).filter(v=>v!=null);
  const minLand = Math.min(...landVals), maxLand = Math.max(...landVals);
  let html = `<table class="compare-table"><thead><tr><th>指标</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(row => {
    html += `<tr><td>${row.label}</td>`;
    platforms.forEach(pl => {
      const val = c[pl][row.key];
      let cls = '';
      if(row.key==='land' && val!=null) {
        if(val===minLand) cls=' class="cell-low"';
        else if(val===maxLand) cls=' class="cell-high"';
      }
      html += `<td${cls}>${row.fmt(val)}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('compareTableWrap').innerHTML = html;
  document.getElementById('arbitrageValue').textContent = p.arbitrage;
  document.getElementById('arbitrageSub').textContent = p.arbitrageSub;
  renderChart(idx);
  renderSummaryTable(idx);
}

function renderChart(idx) {
  const p = PRODUCTS[idx];
  const svg = document.getElementById('priceChart');
  const W=600, H=280, PL=52, PR=20, PT=20, PB=40;
  const cW=W-PL-PR, cH=H-PT-PB;
  const allVals = [...(p.chartData.amazon||[]),...(p.chartData.ebay||[]),...(p.chartData.etsy||[])].filter(v=>v!=null);
  const minV=Math.min(...allVals)-5, maxV=Math.max(...allVals)+5;
  const xStep = cW/6;
  const toX = i => PL + i*xStep;
  const toY = v => PT + cH - ((v-minV)/(maxV-minV))*cH;
  const colors = {amazon:'#f97316',ebay:'#3b82f6',etsy:'#22c55e'};
  let out = '';
  // grid lines
  for(let i=0;i<=4;i++){
    const y=PT+i*(cH/4);
    const val=Math.round(maxV-(i/4)*(maxV-minV));
    out+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#e9d5ff" stroke-width="1"/>`;
    out+=`<text x="${PL-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8b5cf6">$${val}</text>`;
  }
  // x labels
  DAYS.forEach((d,i)=>{
    out+=`<text x="${toX(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#8b5cf6">${d}</text>`;
  });
  // lines + dots
  ['amazon','ebay','etsy'].forEach(pl=>{
    const data=p.chartData[pl];
    const pts=data.map((v,i)=>v!=null?[toX(i),toY(v)]:null).filter(Boolean);
    if(pts.length<2) return;
    out+=`<polyline points="${pts.map(pt=>pt.join(',')).join(' ')}" fill="none" stroke="${colors[pl]}" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(pt=>{
      out+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${colors[pl]}" stroke="#fff" stroke-width="1.5"/>`;
    });
  });
  svg.innerHTML = out;
}

function renderSummaryTable(idx) {
  const p = PRODUCTS[idx];
  const platforms = ['amazon','ebay','etsy'];
  const labels = ['Amazon','eBay','Etsy'];
  const colors = ['#f97316','#3b82f6','#22c55e'];
  let html = `<thead><tr><th>平台</th><th>当前价格</th><th>7日变化</th><th>最低价</th><th>最高价</th></tr></thead><tbody>`;
  platforms.forEach((pl,i)=>{
    const data = p.chartData[pl].filter(v=>v!=null);
    if(!data.length){html+=`<tr><td style="color:${colors[i]};font-weight:700">${labels[i]}</td><td colspan="4" style="color:#aaa">暂无数据</td></tr>`;return;}
    const cur=data[data.length-1], first=data[0];
    const diff=cur-first, pct=((diff/first)*100).toFixed(1);
    const cls=diff>=0?'change-up':'change-down';
    const arrow=diff>=0?'▲':'▼';
    html+=`<tr><td style="color:${colors[i]};font-weight:700">${labels[i]}</td><td>$${cur}</td><td class="${cls}">${arrow} $${Math.abs(diff)} (${Math.abs(pct)}%)</td><td>$${Math.min(...data)}</td><td>$${Math.max(...data)}</td></tr>`;
  });
  html+='</tbody>';
  document.getElementById('summaryTable').innerHTML=html;
}

      </div>
      <div class="watch-actions">
        <button class="watch-btn watch-btn-detail" onclick="goDetail(${id})">查看详情</button>
        <button class="watch-btn watch-btn-remove" onclick="removeWatch(${id})">取消关注</button>
      </div>
    </div>`;
  }).join('');
}

function removeWatch(id){
  const el=document.getElementById('witem-'+id);
  el.classList.add('removing');
  setTimeout(()=>{
    watchlist=watchlist.filter(x=>x!==id);
    renderWatchlist();
  },400);
}

// Init
renderProducts();
renderOtherProducts();
</script>
</body>
